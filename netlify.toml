[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# DO NOT add included_files here for JavaScript sources.
# included_files copies raw files into the Lambda zip but does NOT install
# npm dependencies. Listing server/index.js causes
#   ERR_MODULE_NOT_FOUND: Cannot find package 'express'
# at runtime. esbuild bundling (above) is the correct mechanism.
#
# DO NOT add external_node_modules here either. That forces runtime resolution
# against a node_modules directory that does not exist on Lambda.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
